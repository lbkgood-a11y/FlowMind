server:
  port: ${OPENAPI_SERVICE_PORT:8088}
  shutdown: graceful

spring:
  application:
    name: service-openapi
  config:
    import: optional:nacos:${spring.application.name}.yml
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${OPENAPI_DB_URL:jdbc:postgresql://10.193.102.2:5432/triobase}
    username: ${OPENAPI_DB_USERNAME:postgres}
    password: ${OPENAPI_DB_PASSWORD:pwd123}
    driver-class-name: org.postgresql.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  flyway:
    enabled: ${OPENAPI_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history_openapi
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:10.193.102.2}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:!pwd123$}
      timeout: 2s
  cloud:
    nacos:
      username: nacos
      password: "'!pwd123$'"
      discovery:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:10.193.102.2:8848}
      config:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:10.193.102.2:8848}
        file-extension: yml
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

mybatis-plus:
  type-handlers-package: com.triobase.service.openapi.infrastructure.persistence
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid

triobase:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN:triobase-local-internal-token}
    allowed-callers: ${INTERNAL_ALLOWED_CALLERS:service-workflow-engine,service-openapi}
  integrations:
    auth:
      base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    workflow:
      base-url: ${WORKFLOW_SERVICE_URL:http://localhost:8086}
  openapi:
    gateway-auth-secret: ${OPENAPI_GATEWAY_AUTH_SECRET:}
    runtime:
      enabled: ${OPENAPI_RUNTIME_ENABLED:false}
    retention:
      execution-days: ${OPENAPI_EXECUTION_RETENTION_DAYS:180}
      diagnostic-body-days: ${OPENAPI_DIAGNOSTIC_BODY_RETENTION_DAYS:7}
    credentials:
      provider: ${OPENAPI_CREDENTIAL_PROVIDER:local}
      local:
        secrets:
          policy-signing: '{"signingKey":"local-dev-policy-signing-key-change-me"}'
      vault:
        address: ${VAULT_ADDR:http://10.193.102.2:8200}
        token: ${VAULT_TOKEN:triobase-vault-root-token}
    policy:
      signing-secret-reference: ${OPENAPI_POLICY_SIGNING_SECRET_REFERENCE:policy-signing}

logging:
  level:
    root: INFO
    com.triobase.service.openapi: DEBUG
