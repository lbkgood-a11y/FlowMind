server:
  port: 8081

spring:
  application:
    name: service-auth
  config:
    import: optional:nacos:${spring.application.name}.yml
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://10.193.102.2:5432/triobase}
    username: ${AUTH_DB_USERNAME:postgres}
    password: ${AUTH_DB_PASSWORD:pwd123}
    driver-class-name: org.postgresql.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: ${REDIS_HOST:10.193.102.2}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:!pwd123$}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_auth
    validate-on-migrate: false
    baseline-on-migrate: true
    baseline-version: 0
  cloud:
    nacos:
      username: nacos
      password: "'!pwd123$'"
      discovery:
        enabled: ${NACOS_ENABLED:true}
        server-addr: 10.193.102.2:8848

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

auth:
  jwt:
    secret: ${JWT_SECRET:triobase-local-dev-secret-at-least-32-chars}
    access-token-ttl: 3600
    refresh-token-ttl: 86400

  data:
    redis:
      host: ${REDIS_HOST:10.193.102.2}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:!pwd123$}

triobase:
  integrations:
    lowcode:
      base-url: ${LOWCODE_SERVICE_URL:http://localhost:8085}
  internal:
    token: ${INTERNAL_SERVICE_TOKEN:triobase-local-internal-token}
    allowed-callers: ${INTERNAL_ALLOWED_CALLERS:service-workflow-engine,service-lowcode,service-api-runtime,service-org}

# Temporal Worker — 铁律 5：与微服务生命周期共生死
temporal:
  namespace: default
  task-queue: ${spring.application.name}

logging:
  level:
    root: DEBUG
    com.triobase: DEBUG
