components:
  securitySchemes:
    applicationCredential:
      type: apiKey
      in: header
      name: X-Client-Credential
      description: Gateway-authenticated application credential plus active subscription and policy.
    callbackSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: HMAC or RSA signature validated with timestamp and nonce replay protection.
    gatewayContext:
      type: apiKey
      in: header
      name: X-OpenAPI-Gateway-Secret
      description: Shared gateway/runtime trust secret. Production callers must also send service identity headers.
  parameters:
    RouteKey:
      name: routeKey
      in: path
      required: true
      schema: { type: string }
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: { type: string }
    EnvironmentHeader:
      name: X-Environment
      in: header
      required: true
      schema:
        type: string
        enum: [DEV, TEST, PROD]
    ApplicationClientHeader:
      name: X-Application-Client-Id
      in: header
      required: true
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string }
    StructureId:
      name: structureId
      in: path
      required: true
      schema: { type: string }
    MappingSetId:
      name: mappingSetId
      in: path
      required: true
      schema: { type: string }
    ValueMapSetId:
      name: valueMapSetId
      in: path
      required: true
      schema: { type: string }
    ConnectorId:
      name: connectorId
      in: path
      required: true
      schema: { type: string }
    RouteId:
      name: routeId
      in: path
      required: true
      schema: { type: string }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { type: string }
    OrchestrationId:
      name: orchestrationId
      in: path
      required: true
      schema: { type: string }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string }
    InboxId:
      name: inboxId
      in: path
      required: true
      schema: { type: string }
    Point:
      name: point
      in: path
      required: true
      schema: { type: string }
    AssetType:
      name: assetType
      in: path
      required: true
      schema: { type: string }
    TenantIdQuery:
      name: tenantId
      in: query
      required: false
      schema: { type: string }
    EnvironmentQuery:
      name: environment
      in: query
      required: true
      schema:
        type: string
        enum: [DEV, TEST, PROD]
    ApplicationIdQuery:
      name: applicationId
      in: query
      required: true
      schema: { type: string }
  schemas:
    IntegrationAdmissionRequest:
      type: object
      required: [tenantId, clientKey, environment, routeKey, operation, contentLength]
      properties:
        tenantId: { type: string }
        clientKey: { type: string }
        environment: { type: string, enum: [DEV, TEST, PROD] }
        routeKey: { type: string }
        operation: { type: string }
        scopes:
          type: array
          items: { type: string }
        credential: { type: string }
        signature: { type: string }
        timestamp: { type: string }
        nonce: { type: string }
        bodyHash: { type: string }
        clientCertificateFingerprint: { type: string }
        tls: { type: boolean }
        sourceIp: { type: string }
        contentLength: { type: integer, format: int64, minimum: 0 }
        callback: { type: boolean, default: false }
