openapi: 3.1.0
info:
  title: TrioBase Governed OpenAPI Integration Service
  version: 0.1.0
  license:
    name: Proprietary
servers:
  - url: /api/v1/openapi
tags:
  - name: Runtime
    description: Gateway-only public runtime APIs hosted by service-api-runtime.
  - name: Callback Runtime
    description: Gateway-only partner callback ingress hosted by service-api-runtime.
  - name: Control Plane
    description: Tenant-scoped management APIs hosted by service-openapi.
  - name: Structures
    description: Structure catalog, versions, import and export.
  - name: Mappings
    description: Mapping sets, mapping versions, contract tests and value maps.
  - name: Connectors
    description: Governed connector definitions and endpoint versions.
  - name: Routes
    description: Route definitions, immutable release snapshots and rollback.
  - name: Orchestrations
    description: Management APIs for orchestration DSL versions.
  - name: Applications
    description: API products, applications, clients, credentials, subscriptions and approvals.
  - name: Policies
    description: Traffic policy versions, signed snapshots and enforcement state.
  - name: Operations
    description: Operational readiness and lifecycle catalog APIs.
  - name: Actions
    description: Owner-hosted Global Action endpoints.
  - name: Executions
    description: Execution search, details and callback quarantine.
  - name: Internal Admission
    description: Internal admission decision APIs for platform-gateway and trusted runtime adapters.
security:
  - applicationCredential: []
paths:
  /runtime/{routeKey}:
    parameters:
      - $ref: '#/components/parameters/RouteKey'
      - $ref: '#/components/parameters/EnvironmentHeader'
    post:
      tags: [Runtime]
      x-triobase-service: service-api-runtime
      operationId: invokeSynchronousRoute
      summary: Invoke an eligible synchronous integration route
      description: Requires trusted gateway context headers and resolves the active release through runtime-local resolvers.
      responses:
        '200': { description: Successful canonical response }
        '409': { description: Route requires orchestration }
  /runtime/{routeKey}/orchestrations:
    parameters:
      - $ref: '#/components/parameters/RouteKey'
      - $ref: '#/components/parameters/EnvironmentHeader'
    post:
      tags: [Runtime]
      x-triobase-service: service-api-runtime
      operationId: startOrchestration
      summary: Start or attach to a durable orchestration
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties: { payload: {} }
      responses:
        '200': { description: Execution reference }
        '429': { description: Active workflow capacity exhausted }
  /runtime/orchestrations/{executionId}:
    get:
      tags: [Runtime]
      x-triobase-service: service-api-runtime
      operationId: getOrchestrationStatus
      summary: Query orchestration status
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/ApplicationClientHeader'
      responses:
        '200': { description: Execution status }
        '404': { description: Execution not found }
  /runtime/orchestrations/{executionId}/result:
    get:
      tags: [Runtime]
      x-triobase-service: service-api-runtime
      operationId: getOrchestrationResult
      summary: Query orchestration result
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/ApplicationClientHeader'
      responses:
        '200': { description: Sanitized result }
        '404': { description: Execution not found }
  /runtime/orchestrations/{executionId}/cancel:
    post:
      tags: [Runtime]
      x-triobase-service: service-api-runtime
      operationId: cancelOrchestration
      summary: Request deterministic cancellation and compensation
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/ApplicationClientHeader'
      responses:
        '200': { description: Cancellation accepted }
        '409': { description: Execution cannot be cancelled }
  /callbacks/{callbackKey}:
    post:
      tags: [Callback Runtime]
      x-triobase-service: service-api-runtime
      operationId: receivePartnerCallback
      security:
        - callbackSignature: []
      summary: Receive a signed, versioned partner callback
      parameters:
        - name: callbackKey
          in: path
          required: true
          schema: { type: string }
        - name: X-Signature-Timestamp
          in: header
          required: true
          schema: { type: string }
        - name: X-Signature-Nonce
          in: header
          required: true
          schema: { type: string }
        - name: X-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        '202': { description: Durably accepted or idempotent duplicate }
        '401': { description: Invalid signature or expired timestamp }
        '429': { description: Callback quota exceeded }
  /internal/admission:
    post:
      tags: [Internal Admission]
      x-triobase-service: service-openapi
      operationId: evaluateIntegrationAdmission
      summary: Evaluate tenant, credential, subscription, policy and quota admission
      security:
        - gatewayContext: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationAdmissionRequest'
      responses:
        '200': { description: Admission decision for gateway or runtime adapter }
        '403': { description: Access denied by credential, subscription or policy }
        '503': { description: Admission state unavailable; caller must fail closed }
  /management/executions:
    get:
      tags: [Executions]
      x-triobase-service: service-openapi
      operationId: searchExecutions
      summary: Search tenant-scoped integration executions
      responses:
        '200': { description: Paged execution summaries }
        '403': { description: Permission denied }
  /management/callback-quarantine:
    get:
      tags: [Executions]
      x-triobase-service: service-openapi
      operationId: listCallbackQuarantine
      summary: List quarantined callbacks
      responses:
        '200': { description: Quarantined callback records }
        '403': { description: Permission denied }
  /management/actions/definitions:
    get:
      tags: [Actions]
      x-triobase-service: service-openapi
      operationId: listOpenApiActionDefinitions
      summary: List owner-hosted OpenAPI Global Action definitions
      responses:
        '200': { description: Action definitions }
  /management/actions/dispatch:
    post:
      tags: [Actions]
      x-triobase-service: service-openapi
      operationId: dispatchOpenApiOwnerAction
      summary: Dispatch an owner-hosted OpenAPI Global Action
      responses:
        '200': { description: Action result }
  /management/actions/candidates/validate:
    post:
      tags: [Actions]
      x-triobase-service: service-openapi
      operationId: validateOpenApiActionCandidate
      summary: Validate one OpenAPI action candidate before dispatch
      responses:
        '200': { description: Candidate validation result }
  /management/actions/candidates/batch-validate:
    post:
      tags: [Actions]
      x-triobase-service: service-openapi
      operationId: validateOpenApiActionCandidateBatch
      summary: Validate multiple OpenAPI action candidates before dispatch
      responses:
        '200': { description: Batch validation result }
  /management/actions/candidates/dispatch:
    post:
      tags: [Actions]
      x-triobase-service: service-openapi
      operationId: dispatchOpenApiActionCandidate
      summary: Dispatch one validated OpenAPI action candidate
      responses:
        '200': { description: Action result }
  /management/structures:
    get:
      tags: [Structures]
      x-triobase-service: service-openapi
      operationId: listStructures
      summary: List tenant or global structure definitions
      responses:
        '200': { description: Structure list }
    post:
      tags: [Structures]
      x-triobase-service: service-openapi
      operationId: createStructure
      summary: Create a structure and first draft version
      responses:
        '200': { description: Structure version }
  /management/structures/{structureId}:
    get:
      tags: [Structures]
      x-triobase-service: service-openapi
      operationId: getStructure
      summary: Get a structure definition
      parameters:
        - $ref: '#/components/parameters/StructureId'
      responses:
        '200': { description: Structure detail }
  /management/structures/{structureId}/versions:
    post:
      tags: [Structures]
      x-triobase-service: service-openapi
      operationId: createStructureVersion
      summary: Create a draft structure version
      parameters:
        - $ref: '#/components/parameters/StructureId'
      responses:
        '200': { description: Structure version }
  /management/structures/versions/{versionId}:
    put:
      tags: [Structures]
      x-triobase-service: service-openapi
      operationId: updateStructureVersion
      summary: Update a draft structure version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Structure version }
  /management/structures/versions/{versionId}/publish:
    post:
      tags: [Structures]
      x-triobase-service: service-openapi
      operationId: publishStructureVersion
      summary: Publish a structure version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Structure version }
  /management/structures/versions/{versionId}/deprecate:
    post:
      tags: [Structures]
      x-triobase-service: service-openapi
      operationId: deprecateStructureVersion
      summary: Deprecate a published structure version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Structure version }
  /management/structures/versions/{versionId}/archive:
    post:
      tags: [Structures]
      x-triobase-service: service-openapi
      operationId: archiveStructureVersion
      summary: Archive a structure version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Structure version }
  /management/structures/imports/openapi:
    post:
      tags: [Structures]
      x-triobase-service: service-openapi
      operationId: importOpenApiStructure
      summary: Import structures from an OpenAPI document
      responses:
        '200': { description: Imported structures }
  /management/structures/exports/openapi:
    post:
      tags: [Structures]
      x-triobase-service: service-openapi
      operationId: exportOpenApiStructure
      summary: Export structures as an OpenAPI document
      responses:
        '200': { description: OpenAPI export }
  /management/mappings:
    post:
      tags: [Mappings]
      x-triobase-service: service-openapi
      operationId: createMappingSet
      summary: Create a mapping set and first draft version
      responses:
        '200': { description: Mapping version }
  /management/mappings/{mappingSetId}/versions:
    post:
      tags: [Mappings]
      x-triobase-service: service-openapi
      operationId: createMappingVersion
      summary: Create a draft mapping version
      parameters:
        - $ref: '#/components/parameters/MappingSetId'
      responses:
        '200': { description: Mapping version }
  /management/mappings/versions/{versionId}:
    get:
      tags: [Mappings]
      x-triobase-service: service-openapi
      operationId: getMappingVersion
      summary: Get a mapping version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Mapping version }
  /management/mappings/versions/{versionId}/rules:
    put:
      tags: [Mappings]
      x-triobase-service: service-openapi
      operationId: updateMappingRules
      summary: Replace mapping rules on a draft version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Mapping version }
  /management/mappings/versions/{versionId}/preview:
    post:
      tags: [Mappings]
      x-triobase-service: service-openapi
      operationId: previewMappingVersion
      summary: Preview mapping transformation
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Transformation preview }
  /management/mappings/versions/{versionId}/contract-tests:
    post:
      tags: [Mappings]
      x-triobase-service: service-openapi
      operationId: runMappingContractTests
      summary: Run mapping contract tests before publication
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Contract test result }
  /management/mappings/versions/{versionId}/publish:
    post:
      tags: [Mappings]
      x-triobase-service: service-openapi
      operationId: publishMappingVersion
      summary: Publish a mapping version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Mapping version }
  /management/value-maps:
    post:
      tags: [Mappings]
      x-triobase-service: service-openapi
      operationId: createValueMapSet
      summary: Create a value-map set
      responses:
        '200': { description: Value-map set }
  /management/value-maps/{valueMapSetId}/versions:
    post:
      tags: [Mappings]
      x-triobase-service: service-openapi
      operationId: createValueMapVersion
      summary: Create a draft value-map version
      parameters:
        - $ref: '#/components/parameters/ValueMapSetId'
      responses:
        '200': { description: Value-map version }
  /management/value-maps/versions/{versionId}:
    get:
      tags: [Mappings]
      x-triobase-service: service-openapi
      operationId: getValueMapVersion
      summary: Get a value-map version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Value-map version }
    put:
      tags: [Mappings]
      x-triobase-service: service-openapi
      operationId: updateValueMapVersion
      summary: Update a draft value-map version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Value-map version }
  /management/value-maps/versions/{versionId}/publish:
    post:
      tags: [Mappings]
      x-triobase-service: service-openapi
      operationId: publishValueMapVersion
      summary: Publish a value-map version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Value-map version }
  /management/value-maps/versions/{versionId}/lookup:
    post:
      tags: [Mappings]
      x-triobase-service: service-openapi
      operationId: lookupValueMapEntry
      summary: Resolve one or more value-map entries
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Lookup result }
  /management/connectors:
    post:
      tags: [Connectors]
      x-triobase-service: service-openapi
      operationId: createConnector
      summary: Create a connector and first draft endpoint version
      responses:
        '200': { description: Connector version }
  /management/connectors/{connectorId}/versions:
    post:
      tags: [Connectors]
      x-triobase-service: service-openapi
      operationId: createConnectorVersion
      summary: Create a draft connector endpoint version
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
      responses:
        '200': { description: Connector version }
  /management/connectors/versions/{versionId}:
    get:
      tags: [Connectors]
      x-triobase-service: service-openapi
      operationId: getConnectorVersion
      summary: Get a connector endpoint version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Connector version }
    put:
      tags: [Connectors]
      x-triobase-service: service-openapi
      operationId: updateConnectorVersion
      summary: Update a draft connector endpoint version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Connector version }
  /management/connectors/versions/{versionId}/publish:
    post:
      tags: [Connectors]
      x-triobase-service: service-openapi
      operationId: publishConnectorVersion
      summary: Publish a connector endpoint version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Connector version }
  /management/connectors/versions/{versionId}/deprecate:
    post:
      tags: [Connectors]
      x-triobase-service: service-openapi
      operationId: deprecateConnectorVersion
      summary: Deprecate a connector endpoint version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Connector version }
  /management/connectors/versions/{versionId}/archive:
    post:
      tags: [Connectors]
      x-triobase-service: service-openapi
      operationId: archiveConnectorVersion
      summary: Archive a connector endpoint version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Connector version }
  /management/connectors/{connectorId}/archive:
    post:
      tags: [Connectors]
      x-triobase-service: service-openapi
      operationId: archiveConnector
      summary: Archive a connector definition
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
      responses:
        '200': { description: Connector archived }
  /management/routes:
    post:
      tags: [Routes]
      x-triobase-service: service-openapi
      operationId: createRoute
      summary: Create a route definition and first draft version
      responses:
        '200': { description: Route version }
  /management/routes/{routeId}/versions:
    post:
      tags: [Routes]
      x-triobase-service: service-openapi
      operationId: createRouteVersion
      summary: Create a draft route version
      parameters:
        - $ref: '#/components/parameters/RouteId'
      responses:
        '200': { description: Route version }
  /management/routes/versions/{versionId}:
    get:
      tags: [Routes]
      x-triobase-service: service-openapi
      operationId: getRouteVersion
      summary: Get a route version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Route version }
    put:
      tags: [Routes]
      x-triobase-service: service-openapi
      operationId: updateRouteVersion
      summary: Update a draft route version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Route version }
  /management/routes/versions/{versionId}/publish:
    post:
      tags: [Routes]
      x-triobase-service: service-openapi
      operationId: publishRouteVersion
      summary: Publish a route version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Route version }
  /management/routes/versions/{versionId}/deprecate:
    post:
      tags: [Routes]
      x-triobase-service: service-openapi
      operationId: deprecateRouteVersion
      summary: Deprecate a route version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Route version }
  /management/routes/versions/{versionId}/archive:
    post:
      tags: [Routes]
      x-triobase-service: service-openapi
      operationId: archiveRouteVersion
      summary: Archive a route version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Route version }
  /management/routes/{routeId}/archive:
    post:
      tags: [Routes]
      x-triobase-service: service-openapi
      operationId: archiveRoute
      summary: Archive a route definition
      parameters:
        - $ref: '#/components/parameters/RouteId'
      responses:
        '200': { description: Route archived }
  /management/routes/{routeKey}/resolve-preview:
    post:
      tags: [Routes]
      x-triobase-service: service-openapi
      operationId: previewRouteResolution
      summary: Preview route resolution before release activation
      parameters:
        - $ref: '#/components/parameters/RouteKey'
      responses:
        '200': { description: Resolved route preview }
  /management/routes/versions/{versionId}/releases:
    post:
      tags: [Routes]
      x-triobase-service: service-openapi
      operationId: createRouteRelease
      summary: Create an immutable release snapshot from a published route version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Release snapshot }
  /management/releases/{releaseId}/activate:
    post:
      tags: [Routes]
      x-triobase-service: service-openapi
      operationId: activateRouteRelease
      summary: Atomically activate a release snapshot
      parameters:
        - $ref: '#/components/parameters/ReleaseId'
      responses:
        '200': { description: Active release }
  /management/routes/{routeId}/rollback:
    post:
      tags: [Routes]
      x-triobase-service: service-openapi
      operationId: rollbackRouteRelease
      summary: Roll back a route to a previous release snapshot
      parameters:
        - $ref: '#/components/parameters/RouteId'
      responses:
        '200': { description: Active release }
  /management/releases/{releaseId}/deprecate:
    post:
      tags: [Routes]
      x-triobase-service: service-openapi
      operationId: deprecateRouteRelease
      summary: Deprecate a release snapshot
      parameters:
        - $ref: '#/components/parameters/ReleaseId'
      responses:
        '200': { description: Release snapshot }
  /management/releases/{releaseId}/archive:
    post:
      tags: [Routes]
      x-triobase-service: service-openapi
      operationId: archiveRouteRelease
      summary: Archive a release snapshot
      parameters:
        - $ref: '#/components/parameters/ReleaseId'
      responses:
        '200': { description: Release snapshot }
  /management/routes/{routeId}/releases:
    get:
      tags: [Routes]
      x-triobase-service: service-openapi
      operationId: listRouteReleases
      summary: List release snapshots for a route
      parameters:
        - $ref: '#/components/parameters/RouteId'
      responses:
        '200': { description: Release snapshots }
  /management/routes/{routeKey}/active-release:
    get:
      tags: [Routes]
      x-triobase-service: service-openapi
      operationId: getActiveRouteRelease
      summary: Resolve the active release for a route key and environment
      parameters:
        - $ref: '#/components/parameters/RouteKey'
        - $ref: '#/components/parameters/EnvironmentQuery'
      responses:
        '200': { description: Active release }
  /management/orchestrations:
    post:
      tags: [Orchestrations]
      x-triobase-service: service-openapi
      operationId: createOrchestration
      summary: Create an orchestration definition and first draft version
      responses:
        '200': { description: Orchestration version }
  /management/orchestrations/{orchestrationId}/versions:
    post:
      tags: [Orchestrations]
      x-triobase-service: service-openapi
      operationId: createOrchestrationVersion
      summary: Create a draft orchestration DSL version
      parameters:
        - $ref: '#/components/parameters/OrchestrationId'
      responses:
        '200': { description: Orchestration version }
  /management/orchestrations/versions/{versionId}:
    get:
      tags: [Orchestrations]
      x-triobase-service: service-openapi
      operationId: getOrchestrationVersion
      summary: Get an orchestration DSL version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Orchestration version }
    put:
      tags: [Orchestrations]
      x-triobase-service: service-openapi
      operationId: updateOrchestrationVersion
      summary: Update a draft orchestration DSL version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Orchestration version }
  /management/orchestrations/versions/{versionId}/publish:
    post:
      tags: [Orchestrations]
      x-triobase-service: service-openapi
      operationId: publishOrchestrationVersion
      summary: Publish an orchestration DSL version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Orchestration version }
  /management/orchestrations/versions/{versionId}/deprecate:
    post:
      tags: [Orchestrations]
      x-triobase-service: service-openapi
      operationId: deprecateOrchestrationVersion
      summary: Deprecate an orchestration DSL version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Orchestration version }
  /management/orchestrations/versions/{versionId}/archive:
    post:
      tags: [Orchestrations]
      x-triobase-service: service-openapi
      operationId: archiveOrchestrationVersion
      summary: Archive an orchestration DSL version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Orchestration version }
  /management/orchestrations/{orchestrationId}/archive:
    post:
      tags: [Orchestrations]
      x-triobase-service: service-openapi
      operationId: archiveOrchestration
      summary: Archive an orchestration definition
      parameters:
        - $ref: '#/components/parameters/OrchestrationId'
      responses:
        '200': { description: Orchestration archived }
  /management/callback-profiles:
    post:
      tags: [Callback Runtime]
      x-triobase-service: service-openapi
      operationId: createCallbackProfile
      summary: Create a callback profile and first draft version
      responses:
        '200': { description: Callback profile version }
  /management/callback-profiles/{profileId}/versions:
    post:
      tags: [Callback Runtime]
      x-triobase-service: service-openapi
      operationId: createCallbackProfileVersion
      summary: Create a draft callback profile version
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200': { description: Callback profile version }
  /management/callback-profiles/versions/{versionId}:
    get:
      tags: [Callback Runtime]
      x-triobase-service: service-openapi
      operationId: getCallbackProfileVersion
      summary: Get a callback profile version
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { description: Callback profile version }
